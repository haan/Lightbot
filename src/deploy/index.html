<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title data-i18n="title"></title>
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link href='http://fonts.googleapis.com/css?family=PT+Sans:400,700' rel='stylesheet' type='text/css' />
    <link href='http://fonts.googleapis.com/css?family=Lato:400,900' rel='stylesheet' type='text/css' />
    <link type="text/css" href="css/lightbot.min.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-1.7.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui-1.8.16.custom.min.js"></script>
    <script type="text/javascript" src="js/locales/translations.js"></script>
    <script type="text/javascript" src="js/i18next.min.js"></script>
    <script type="text/javascript" src="js/jquery.jplayer.min.js"></script>
    <script type="text/javascript" src="js/jquery.history.js"></script>
    <script type="text/javascript" src="js/lightbot.min.js"></script>
  </head>
  <body>
    <div id="audioContainer">
      <div id="audioPlayer"></div>
    </div>

    <div id="lightbot">

      <div id="credits">
        Developed by <a href="http://www.haan.lu" target="_blank">Laurent Haan</a>. Interface by <a href="http://www.zententia.net">Zenobia Homan</a>. Robot by <a href="http://www.pixeljoint.com/forum/member_profile.asp?PF=2146">surt</a>. Music by <a href="http://hektikmusic.newgrounds.com/" target="_blank">hektikmusic</a>. Original concept: <a href="http://lightbot.com/" target="_blank">lightbot.com</a>.
      </div>

      <div id="welcomeScreen" class="ui-screen">
        <button class="helpButton"  data-i18n="welcomeScreen.help"></button>
        <button class="achievementsButton" data-i18n="welcomeScreen.achievements"></button>
        <button class="levelSelectButton ui-state-highlight" data-i18n="welcomeScreen.start"></button>
        <button class="audioToggleButton" data-i18n="welcomeScreen.toggleAudio"></button>
      </div>

      <div id="achievementsScreen" class="ui-screen ui-helper-hidden">
        <h1 data-i18n="achievementsScreen.title"></h1>
        <ul id="achievementsList">
        </ul>
        <button class="mainMenuButton" data-i18n="achievementsScreen.mainMenu"></button>
      </div>

      <div id="helpScreen" class="ui-screen ui-helper-hidden">
        <div id="helpScreenAccordionContainer">
          <div id="helpScreenAccordion">
            <h3><a href="#goal" data-i18n="helpScreen.goal.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.goal.content"></p>
            </div>
            <h3><a href="#howto" data-i18n="helpScreen.howTo.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.howTo.content"></p>
            </div>
            <h3><a href="#objects" data-i18n="helpScreen.objects.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.objects.content"></p>
            </div>
            <h3><a href="#walk_forward" data-i18n="helpScreen.walkForward.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.walkForward.content"></p>
            </div>
            <h3><a href="#turn_right" data-i18n="helpScreen.turnRight.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.turnRight.content"></p>
            </div>
            <h3><a href="#turn_left" data-i18n="helpScreen.turnLeft.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.turnLeft.content"></p>
            </div>
            <h3><a href="#jump" data-i18n="helpScreen.jump.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.jump.content"></p>
            </div>
            <h3><a href="#light" data-i18n="helpScreen.light.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.light.content"></p>
            </div>
            <h3><a href="#repeat" data-i18n="helpScreen.repeat.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.repeat.content"></p>
            </div>
            <h3><a href="#medals" data-i18n="helpScreen.medals.title"></a></h3>
            <div>
              <p data-i18n="helpScreen.medals.content"></p>
            </div>
          </div>
        </div>
        <div id="helpScreenVerticalBar"></div>
        <div id="videoContainer" class="jp-video jp-video-300p">
          <div class="jp-type-single">
            <div id="videoPlayer" class="jp-jplayer"></div>
            <div class="jp-gui">
              <div class="jp-video-play">
                <a href="javascript:;" class="jp-video-play-icon" tabindex="1" data-i18n="helpScreen.video.play"></a>
              </div>
              <div class="jp-interface">
                <div class="jp-progress">
                  <div class="jp-seek-bar">
                    <div class="jp-play-bar"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="mainMenuButton" data-i18n="helpScreen.mainMenu"></button>
      </div>

      <div id="levelSelectScreen" class="ui-screen ui-helper-hidden">
        <h1 data-i18n="levelSelectScreen.title"></h1>
        <ul id="levelList">
        </ul>
        <button class="mainMenuButton" data-i18n="levelSelectScreen.mainMenu"></button>
      </div>

      <div id="gameScreen" class="ui-screen ui-helper-hidden">
        <div id="canvasContainer">
          <canvas id="gameCanvas" width="690" height="666"></canvas>
        </div>
        <div id="buttonContainer">
          <button class="levelSelectButton" data-i18n="gameScreen.back"></button>
          <button class="audioToggleButton" data-i18n="gameScreen.toggleAudio"></button>
          <button id="clearButton" data-i18n="gameScreen.clear"></button>
          <button id="runButton" data-i18n="gameScreen.run"></button>
          <div id="speedControl">
            <label for="speedSlider" data-i18n="gameScreen.speed"></label>
            <div id="speedSlider"></div>
          </div>
        </div>
        <div id="instructionsContainer">
          <h2 data-i18n="instructions.title"></h2>
          <div>
            <ul>
                <li><p class="walk"><span class="ui-icon ui-icon-arrowthick-1-n" style="float: left;"></span><span data-i18n="instructions.walk">tgfhfghfhg</span><span class="ui-icon ui-icon-close" style="float: right;"></span></p></li>
                <li><p class="turnRight"><span class="ui-icon ui-icon-arrowreturnthick-1-w flip" style="float: left;"></span><span data-i18n="instructions.turnRight"></span><span class="ui-icon ui-icon-close" style="float: right;"></span></p></li>
                <li><p class="turnLeft"><span class="ui-icon ui-icon-arrowreturnthick-1-w" style="float: left;"></span><span data-i18n="instructions.turnLeft"></span><span class="ui-icon ui-icon-close" style="float: right;"></span></p></li>
                <li><p class="jump"><span class="ui-icon ui-icon-arrowthickstop-1-n" style="float: left;"></span><span data-i18n="instructions.jump"></span><span class="ui-icon ui-icon-close" style="float: right;"></span></p></li>
                <li><p class="light"><span class="ui-icon ui-icon-lightbulb" style="float: left;"></span><span data-i18n="instructions.light"></span><span class="ui-icon ui-icon-close" style="float: right;"></span></p></li>
                <li><p class="repeat"><span class="ui-icon ui-icon-refresh" style="float: left;"></span><span data-i18n="instructions.repeat.label"></span> <span class="repeatCountLabel"><input type="number" min="1" max="99" step="1" value="2"> <span data-i18n="instructions.repeat.times"></span></span><span class="ui-icon ui-icon-close" style="float: right;"></span></p>
                  <div class="droppable">
                    <div class="ui-widget-content">
                      <ul>
                        <li class="placeholder"><p class="placeholder" data-i18n="instructions.placeholder"></p></li>
                      </ul>
                    </div>
                  </div>
                </li>
            </ul>
          </div>
        </div>
        <div id="programContainer">
          <h2 data-i18n="program.title"></h2>
          <div class="droppable">
            <ul>
            </ul>
          </div>
        </div>
      </div>

      <div id="credits2">
        <div style="float:left;"></div>
        <div style="float:right;"></div>
      </div>
    </div>

    <div id="dialogs">
      <div id="levelCompleteDialog" title="Level complete" data-i18n-title="dialogs.levelComplete.title">
        <p>
          <span class="medal" style="float:left; margin:0 7px 50px 0;"></span>
          <span class="message" data-i18n="dialogs.levelComplete.message"></span>
        </p>
        <p class="hint" style="margin-top: 10px"></p>
      </div>

      <div id="achievementDialog" title="Achievement unlocked!" data-i18n-title="dialogs.achievement.title">
        <p>
          <span class="achievement" style="float:left; margin:0 7px 50px 0;"></span>
          <span class="message"></span>
        </p>
      </div>
    </div>
  </body>
</html>
