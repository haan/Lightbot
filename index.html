<!DOCTYPE html>
<html data-theme="lightbot">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightbot v1.4.0</title>
  <link rel="shortcut icon" href="img/favicon.ico" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { }
    })();
  </script>
  <!-- lightbot:entry:start -->
  <script type="module" src="/src/main.js"></script>
  <!-- lightbot:entry:end -->
</head>

<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center">
  <div id="audioContainer">
    <audio id="audioPlayer" preload="auto"></audio>
  </div>

  <div id="lightbot" class="relative w-[980px] h-[740px] shrink-0">

            <option value="garden">garden</option>
            <option value="forest">forest</option>
            <option value="aqua">aqua</option>
            <option value="lofi">lofi</option>
            <option value="pastel">pastel</option>

    <div id="achievementsScreen"
      class="lb-screen hidden absolute top-5 inset-x-0 bottom-4 rounded-box shadow lb-menu-screen"
      aria-labelledby="achievementsTitle">
      <div class="lb-menu-shell">
        <header class="lb-menu-header">
          <h1 id="achievementsTitle" data-i18n="achievementsScreen.title"></h1>
          <button class="mainMenuButton lb-menu-back">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H19v-2Z" />
            </svg>
            <span data-i18n="achievementsScreen.mainMenu"></span>
          </button>
        </header>
        <div class="achievements-summary">
          <p id="achievementSummary">
            <span data-i18n="achievementsScreen.progress"></span>
            <strong id="achievementCount"></strong>
          </p>
          <progress id="achievementProgress" max="8" value="0" aria-labelledby="achievementSummary"></progress>
        </div>
        <ul id="achievementsList" class="achievements-list" tabindex="0" aria-labelledby="achievementsTitle"></ul>
      </div>
    </div>

    <div id="helpScreen" class="lb-screen hidden absolute top-5 inset-x-0 bottom-4 rounded-box shadow lb-menu-screen"

            <h2 id="helpDetailTitle" class="help-lesson-title" data-i18n="helpScreen.goal.title"></h2>

    <div id="levelSelectScreen"

                  </li>
                  <li class="lb-instruction">
                    <p class="repeat lb-instruction-row" tabindex="0" role="button" data-i18n-title="instructions.repeat.label">
                      <svg class="instruction-symbol" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="m17 3 4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4m14 0v2a2 2 0 0 1-2 2H3" /></svg>
                      <span class="lb-repeat-left flex items-center gap-2">
                        <span class="lb-instruction-label" data-i18n="instructions.repeat.label"></span>
                        <span class="lb-repeat-count">
                          <button type="button" data-repeat-step="-1" data-i18n-title="gameScreen.decreaseRepeat">
                            <span aria-hidden="true">−</span><span class="sr-only" data-i18n="gameScreen.decreaseRepeat"></span>
                          </button>
                          <input type="number" min="1" max="99" step="1" value="2"
                            class="lb-repeat-value" data-i18n-title="instructions.repeat.label" />
                          <button type="button" data-repeat-step="1" data-i18n-title="gameScreen.increaseRepeat">
                            <span aria-hidden="true">+</span><span class="sr-only" data-i18n="gameScreen.increaseRepeat"></span>
                          </button>
                        </span>
                      </span>
                      <button type="button" class="lb-instruction-delete btn btn-ghost btn-xs btn-square"
                        data-i18n-title="gameScreen.remove" title="Remove">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-4 fill-current">
                          <path
                            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z" />
                        </svg>
                      </button>
                    </p>
                    <div class="lb-repeat-body droppable">
                      <div class="lb-repeat-body-inner">
                        <ul class="space-y-2"></ul>
                      </div>
                    </div>
                  </li>

            </ul>
          </div>
          <div id="programContainer" class="game-program">
            <div class="game-program-body">
              <div class="game-program-header">
                <h2 data-i18n="program.title"></h2>
                <p id="gameRunStatus" class="game-hint" role="status" hidden></p>
                <button id="clearButton" class="lb-button" data-i18n-title="gameScreen.clear" title="Clear">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                <path fill-rule="evenodd"
                  d="M5 3.25V4H2.75a.75.75 0 0 0 0 1.5h.3l.815 8.15A1.5 1.5 0 0 0 5.357 15h5.285a1.5 1.5 0 0 0 1.493-1.35l.815-8.15h.3a.75.75 0 0 0 0-1.5H11v-.75A2.25 2.25 0 0 0 8.75 1h-1.5A2.25 2.25 0 0 0 5 3.25Zm2.25-.75a.75.75 0 0 0-.75.75V4h3v-.75a.75.75 0 0 0-.75-.75h-1.5ZM6.05 6a.75.75 0 0 1 .787.713l.275 5.5a.75.75 0 0 1-1.498.075l-.275-5.5A.75.75 0 0 1 6.05 6Zm3.9 0a.75.75 0 0 1 .712.787l-.275 5.5a.75.75 0 0 1-1.498-.075l.275-5.5a.75.75 0 0 1 .786-.711Z"
                  clip-rule="evenodd" />
              </svg>
            <span data-i18n="gameScreen.clear"></span></button>
              </div>
              <div class="droppable game-program-scroll">
                <ul id="mainProgram"></ul>
                <p class="program-empty" data-i18n="instructions.placeholder"></p>
              </div>
            </div>
          </div>
              <div id="buttonContainer" class="game-execution">
                <button id="runButton" class="lb-button game-run" data-i18n-title="gameScreen.run"
              title="Run">
              <svg class="lb-run-icon size-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7-11-7Z" />
              </svg>
              <svg class="lb-pause-icon hidden size-4 fill-current" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">
                <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
              </svg>
            <span class="lb-run-label" data-i18n="gameScreen.run"></span></button>
                <button id="resetButton" type="button" class="lb-button game-reset" disabled data-i18n-title="gameScreen.reset">
                  <svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7" /></svg>
                  <span class="sr-only" data-i18n="gameScreen.reset"></span>
                </button>
                <div id="speedControl">
                  <label for="speedSlider" data-i18n="gameScreen.speed"></label>
                  <input id="speedSlider" type="range" min="0.5" max="3.0" step="0.01" value="2" class="range range-xs range-primary" />
                </div>
              </div>
        </aside>

      </div>
    </div>

    <div id="credits2" class="absolute bottom-0 inset-x-0 h-4 text-center text-xs opacity-70">
      <div style="float:left;"></div>
      <div style="float:right;"></div>
    </div>
  <dialog id="levelCompleteDialog" class="lb-dialog" aria-labelledby="levelCompleteTitle">
    <div class="lb-dialog-box">
      <h3 id="levelCompleteTitle" data-i18n="dialogs.levelComplete.title"></h3>
      <div class="lb-dialog-content">
        <span class="medal shrink-0"></span>
        <div class="flex-1">
          <p class="message" data-i18n="dialogs.levelComplete.message"></p>
          <p class="hint mt-2 text-sm opacity-80"></p>
        </div>
      </div>
      <div class="lb-dialog-actions">
        <form method="dialog">
          <button class="lb-button">OK</button>
        </form>
      </div>
    </div>
  </dialog>

  <dialog id="achievementDialog" class="lb-dialog" aria-labelledby="achievementTitle">
    <div class="lb-dialog-box">
      <h3 id="achievementTitle" data-i18n="dialogs.achievement.title"></h3>
      <div class="lb-dialog-content">
        <span class="achievement shrink-0"></span>
        <p class="message flex-1"></p>
      </div>
      <div class="lb-dialog-actions">
        <form method="dialog">
          <button class="lb-button">OK</button>
        </form>
      </div>
    </div>
  </dialog>
  </div>
</body>

</html>
